<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Armarius</title>
    <meta name="theme-color" content="#f9f7f2" />
    <!-- Set the theme before first paint so a reload never flashes the wrong one. Same rule as
         src/hooks/use-theme.ts: the stored choice, else the OS preference. -->
    <script>
      (function () {
        var t = null
        try { t = localStorage.getItem('armarius.theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
